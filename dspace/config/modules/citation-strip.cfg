#---------------------------------------------------------------#
#---------------CITATION STRIP CONFIGURATIONS-------------------#
#---------------------------------------------------------------#
# Configuration properties used solely by the PDF Citation      #
# Strip feature.                                                #
#---------------------------------------------------------------#
#Boolean to determine is citation-functionality is enabled globally for entire site.
#default => false
#citation-strip.enable_globally=true

#List of collection handles to enable, to apply to nested bitstreams within
#default =>  empty. This is to be collection handles, separated by commas. ex: 1811/123, 1811/234
#citation-strip.enabled_collections=

#List of community handles to enable, to apply to nested bitstreams within
#default => empty. This is to be community handles, separated by commas. ex: 1811/222, 1811/333
#citation-strip.enabled_communities=

# Color, in the form of a tuple of three floats between 0.0f and 1.0f, of the citation strip
#default => 0.65f, 0.65f, 0.65f
#citation-strip.color=0.65f, 0.65f, 0.65f

# Maximum distance, in points, between the edge of the paper and the baseline of the first
# line of the citation strip. Set to "none" if no max distance wants to be specified. The citation
# strip will be placed at max distance of centered in the empty space of the left margin, whichever
# value is lower.
# ex: citation-strip.margin_max_distance=40
# ex: citation-strip.margin_max_distance=none
#default => none
#citation-strip.margin_max_distance=none